<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukkergris - Admin Login</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <main>
        <section id="loginSection">
            <h1>Admin Login</h1>
            <form id="adminLoginForm">
                <label for="usernameInput">Username</label>
                <input type="email" id="usernameInput" value="augustus.gloop@sukkergris.no" required>

                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" value="laffytaffy" required>

                <button type="submit">Log in</button>
            </form>
            <p id="errorMessage"></p>
        </section>

        <section id="adminMenuSection" hidden>
            <h1>Administration</h1>
            <nav>
                <button type="button" id="productsBtn">Products</button>
                <button type="button" id="ordersBtn">Orders</button>
                <button type="button" id="usersBtn">Users</button>
                <button type="button" id="reviewsBtn">User comments/reviews</button>
            </nav>
            <button type="button" id="logoutBtn">Log out</button>
        </section>
    </main>

    <script type="module" src="../js/adminLogin.js"></script>
</body>
</html>
