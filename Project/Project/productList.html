<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="utils.js"></script>
</head>

<body>

    <h1>Product list</h1>
    <a href="index.html">Tilbake til Forsiden</a>
    <hr>
    <div id="container"></div>

    <script>

        let container = document.getElementById('container');

        //get current category from localStorage
        const catId = localStorage.getItem("catId");

        //url to products by category
        const url = `https://sukkergris.onrender.com/webshop/chocolates?catID=${catId}&key=${groupkey}`;

        loadData();

        //----------------------------------------------------------------
        async function loadData() {

            try {
                const dataFromServer = await sendRequest(url); //using sendRequest in utils.js
                refresh(dataFromServer)
            } catch (error) {
                errorHandler(error); //using errorHandler in utils.js                
            }
        }

        //----------------------------------------------------------------
        function refresh(data) {

            console.log(data);

            container.innerHTML = "";

            for (let value of data) {
                const div = document.createElement("div");
                div.innerHTML = `
                <img src="https://sukkergris.onrender.com/images/GFTPOE21/small/${value.thumb}" alt="${value.chocoName}">
                  <h2>${value.chocoName}</h2>
                  <p>${value.descr}</p>
                  <p>${value.price},- kr</p><hr>           
                `;
                container.appendChild(div);
                     div.addEventListener('click', evt => {                   
                    
                    localStorage.setItem("productId", value.id); //save the category id in local storage
                    location.href = "productDetail.html"; //go to the product list
                    
                });
            }
        }

    </script>

</body>

</html>
